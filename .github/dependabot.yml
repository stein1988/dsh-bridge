# Dependabot 依赖更新配置
#
# 作用：自动发现依赖的新版本与已知漏洞，并按下面的分组开 PR。
# 需要留意的版本耦合点（决定了分组方式）：
#   - `@deepseek-ai/*` 是 DSH 宿主的包（dsh-llm / cordis），版本与宿主强绑定。
#     本插件声明兼容 DSH 0.1.0~0.1.5 全系列，自动跟进可能破坏兼容性，
#     故单独成组、单独审核，不与其它依赖混在一个 PR 里。
#   - 升级构建链依赖（esbuild / globals 等）后必须重跑 `npm run build:client`
#     并提交产物；升级 lark SDK 后需重跑 `npm run build:lark`。
version: 2
updates:
  # ---- npm 依赖：每周一检查 ----
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # DSH 宿主包：与宿主版本强耦合，必须同批升级、同批验证。
      #
      # 这里刻意用「显式包名」而不是 scoped glob `@deepseek-ai/*`：实测该 glob 对
      # scoped 依赖名匹配不上，会导致宿主包反而落进 development 组；而一旦再用
      # exclude-patterns 把它从 development 排除，更新就会彻底消失（没有 PR）。
      # 显式列名最可靠，且失败时的降级方向是安全的（落回 development 组，仍有 PR）。
      # 新增宿主依赖时记得补进这里。
      dsh-host:
        patterns:
          - "@deepseek-ai/dsh-llm"
          - "@deepseek-ai/cordis"
      # 生产依赖（qrcode / ws）：直接影响运行时，单独一组便于优先验证
      production:
        dependency-type: production
      # 开发与构建依赖（esbuild / eslint / puppeteer-core / lark SDK 等）：
      # 合为一个 PR 降噪
      development:
        dependency-type: development

  # ---- GitHub Actions：每月检查 ----
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
