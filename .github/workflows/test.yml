name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # lib/qq/qqbot-bundled.mjs 是入库的构建产物（发布物只带 lib/，不带 node_modules）。
      # 重建一次并比对：产物与源码不同步时直接失败，避免"改了源码忘了重新打包"
      # 导致用户装到的版本行为与仓库源码不一致。
      #
      # 只在 ubuntu + node 22 上做：esbuild 产物在极端情况下可能带平台相关差异，
      # 四个矩阵全跑会让"构建产物字节一致性"变成跨平台赌注（误报即红灯）。
      # 校验的目的是"源码改了要记得重新打包"，一个稳定组合足够，Windows/Node 24 只跑功能测试。
      - name: Verify QQ SDK bundle is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          node scripts/bundle-qq.mjs
          git diff --exit-code -- lib/qq/qqbot-bundled.mjs

      # client/client.js 同样是入库产物。此前只在注释里约定"改了 index.js 要重建"，
      # 没有 CI 校验——复核变异测试证实：删掉源码里的某个开关但不重打包，测试全绿。
      - name: Verify client bundle is up to date
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == 22
        run: |
          node client/build.mjs
          git diff --exit-code -- client/client.js

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
